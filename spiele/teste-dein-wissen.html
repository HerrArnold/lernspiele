<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#273a28;background:#fbf9f3;--green:#47874d}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 2% 3%,#f7e4c1,transparent 35%),radial-gradient(circle at 98% 95%,#d8ead2,transparent 40%),#fbf9f3}button,input{font:inherit}button{cursor:pointer}.shell{max-width:1110px;margin:auto;padding:15px 22px 28px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:13px}h1{font-size:clamp(27px,3vw,38px);color:#3d653b;margin:0}.progress{font-size:18px;font-weight:850;background:#fff;border:1px solid #d5e3d1;padding:11px 18px;border-radius:13px}.board{border:2px solid #e3dfd2;border-radius:24px;background:#fffdfa;box-shadow:0 16px 40px #4b5e3818;padding:25px;min-height:440px}.prompt{text-align:center;font-size:clamp(20px,2.6vw,30px);font-weight:850;color:#365236;margin:8px auto 20px}.large-number{text-align:center;font-size:clamp(47px,7vw,83px);font-weight:900;color:#365136;margin:14px auto}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:22px auto 0}.action{background:#51864e;border:0;border-radius:14px;color:#fff;font-size:20px;font-weight:850;min-width:210px;min-height:52px;padding:12px 25px}.action:disabled{opacity:.45;cursor:default}.secondary{background:#eaf3e4;color:#325d32}.hide{display:none!important}.entry{width:130px;max-width:100%;height:65px;font-size:32px;font-weight:800;color:#273a28;text-align:center;border:2px solid #adc8a6;background:#fff;border-radius:13px}.entry:focus{outline:3px solid #98bc94}.fieldline{display:flex;align-items:center;justify-content:center;gap:12px;font-size:22px;font-weight:800;margin:16px auto}.parts{display:flex;justify-content:center;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:28px auto}.part{display:grid;gap:8px;justify-items:center}.part label{font-size:19px;font-weight:800}.plus{font-size:38px;font-weight:850;padding-bottom:13px}.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;max-width:860px;margin:12px auto}.box{border:2px solid #e0e7db;background:#fcfcf7;border-radius:15px;text-align:center;padding:12px 5px;min-height:150px;overflow:hidden}.box-title{font-size:clamp(14px,1.8vw,18px);font-weight:850;margin-bottom:13px}.box .entry{width:95px;height:56px;font-size:27px}.hundred-grid{display:grid;grid-template-columns:repeat(5,27px);gap:6px;justify-content:center}.hundred{width:27px;height:27px;border:2px solid #263b2c;background:white}.stack{display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:flex-start}.ten-stack{display:grid;gap:6px;justify-items:start}.ten{width:66px;height:7px;border-radius:4px;background:#263b2c}.dots{display:grid;grid-template-columns:repeat(5,11px);gap:9px 7px;justify-content:center;justify-items:center;align-content:center;min-height:29px}.dot{width:9px;height:9px;border-radius:50%;background:#263b2c}.one-stack{display:grid;gap:10px;justify-content:center}.one-row{display:flex;gap:12px;align-items:center;justify-content:flex-start}.one-five{display:grid;grid-template-columns:repeat(5,9px);gap:6px}.one{width:9px;height:9px;border-radius:50%;background:#263b2c}.place-table{width:min(100%,520px);margin:14px auto;border-spacing:0;border:2px solid #94b390;border-radius:16px;overflow:hidden;table-layout:fixed}.place-table th{background:#e6f0df;padding:12px;font-size:24px}.place-table td{border-top:2px solid #c7d7c4;vertical-align:top;text-align:center;padding:16px 5px;height:108px}.place-table th:not(:last-child),.place-table td:not(:last-child){border-right:2px solid #c7d7c4}.page-head{display:flex;align-items:center;justify-content:center;gap:14px;margin:9px auto}.page-head button{border:2px solid #c9d8be;border-radius:11px;font-size:24px;color:#315330;background:#ecf5e8;padding:5px 20px}.page-head button:disabled{opacity:.3}.page-range{font-size:21px;font-weight:800;min-width:155px;text-align:center}.book{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;width:min(100%,790px);margin:auto}.book button{border:1px solid #ccd9c7;border-radius:5px;background:white;color:#344f34;font-weight:800;font-size:clamp(12px,1.65vw,17px);aspect-ratio:1.7/1;min-height:24px}.book button.blank{color:transparent}.book button.chosen{background:#c1e5b7;border:2px solid #418244;color:#24572c}.tiny{text-align:center;color:#6a7565;font-weight:700}.score{text-align:center;font-size:clamp(27px,4vw,43px);font-weight:900;color:#356b3d;margin:20px auto}.review{display:grid;gap:15px;margin-top:22px}.review-item{border:2px solid #d9e5d5;border-radius:17px;padding:15px;background:#fff}.review-item h3{margin:0 0 9px;font-size:19px}.review-item p{font-size:18px;line-height:1.5;margin:7px 0}.review-item .mini-view{max-width:650px;margin:12px auto}.review-item .three{gap:6px}.review-item .box{min-height:110px;padding:8px 3px}.review-item .hundred-grid{grid-template-columns:repeat(5,18px);gap:4px}.review-item .hundred{width:18px;height:18px}.review-item .ten{width:46px;height:5px}.review-item .dots{grid-template-columns:repeat(5,7px);gap:6px}.review-item .dot{width:7px;height:7px}.review-item .one-five{grid-template-columns:repeat(5,7px);gap:4px}.review-item .one{width:7px;height:7px}.review-item .box-title{font-size:13px}.review-item .place-table{max-width:430px}.review-item .place-table td{height:70px;padding:8px 4px}.review-item .book{max-width:620px}.review-item .book button{font-size:12px;min-height:19px}.review-item .book button.correct{background:#d4efc9;border:2px solid #4c9654;color:#28532e}.review-item .page-range{font-size:17px}.review-item .note{color:#496a47}.correct-badge{color:#22753a}.wrong-badge{color:#a24032}.message{min-height:28px;text-align:center;font-weight:750;color:#aa4939}.intro{max-width:650px;margin:45px auto;text-align:center}.intro p{font-size:21px;line-height:1.5}.subject-chip{display:table;margin:0 auto 12px;padding:7px 15px;background:#ebf4e5;border-radius:20px;font-weight:800;color:#4b7146}@media(max-width:730px){.shell{padding:10px}.board{padding:14px 8px}.top{flex-wrap:wrap}h1{font-size:25px}.progress{font-size:15px}.three{gap:5px}.box{padding:9px 2px;min-height:135px}.box-title{font-size:12px}.hundred-grid{grid-template-columns:repeat(5,17px);gap:3px}.hundred{width:17px;height:17px}.ten{width:45px}.dots{grid-template-columns:repeat(5,7px);gap:5px}.dot{width:7px;height:7px}.one-five{grid-template-columns:repeat(5,6px);gap:3px}.one{width:6px;height:6px}.one-row{gap:6px}.entry{width:102px;font-size:25px}.box .entry{width:65px}.parts{gap:5px}.part label{font-size:14px}.part .entry{width:87px}.plus{font-size:26px}.book{gap:2px}.book button{font-size:clamp(9px,2.5vw,14px);aspect-ratio:1/1}.review-item .three{grid-template-columns:repeat(3,minmax(0,1fr))}.review-item .hundred-grid{grid-template-columns:repeat(5,11px);gap:2px}.review-item .hundred{width:11px;height:11px;border-width:1px}.review-item .ten{width:33px;height:5px}.review-item .one-five{grid-template-columns:repeat(5,5px);gap:2px}.review-item .one{width:5px;height:5px}}
</style><link rel="stylesheet" href="../assets/game-theme.css">

<link rel="stylesheet" href="../assets/lernsafari-dark.css?v=1"></head><body>
<div class="safari-exit-bar"><span>Lernsafari</span><a href="../index.html#aktuelle">✕ Spiel beenden</a></div><main class="shell"><header class="top"><h1>Teste dein Wissen</h1><div id="progress" class="progress hide">Aufgabe 1 von 15</div></header><section class="board"><div id="intro" class="intro"><h2>Bereit?</h2><p>15 Aufgaben aus deinen fünf Mathe-Spielen.<br>Am Schluss siehst du dein Ergebnis.</p><button id="start" class="action">Starten</button></div><div id="exam" class="hide"><div id="category" class="subject-chip"></div><div id="question"></div><div id="message" class="message" aria-live="polite"></div><div class="actions"><button id="next" class="action">Weiter</button></div></div><div id="end" class="hide"><div class="score" id="score"></div><div id="allgood" class="tiny"></div><div id="review" class="review"></div><div class="actions"><button id="restart" class="action">Noch einmal</button><a href="../index.html" class="action secondary" style="text-decoration:none;text-align:center">Zur Startseite</a></div></div></section></main><script>
'use strict';
const $=id=>document.getElementById(id);const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const labels={find:'Finde die Zahl',table:'Stellentafel',split:'Hunderter, Zehner und Einer zerlegen',count:'Wie viele Hundertertafeln, Zehnerstangen und Einerwürfel?',identify:'Welche Zahl ist das?'};
let tasks=[],index=0,results=[],page=0,chosen=null;
const d3=n=>[Math.floor(n/100),Math.floor(n%100/10),n%10];
const nums=(n,min=0,max=999)=>Number.isInteger(n)&&n>=min&&n<=max;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rand(0,i);[a[i],a[j]]=[a[j],a[i]]}return a}
function newTask(type,seen){let n;do{n=rand(1,type==='table'||type==='split'?999:1000)}while(seen.has(type+':'+n));seen.add(type+':'+n);let h,z,e;if(type==='identify'){do{h=rand(1,8);z=rand(0,9);e=rand(0,18);n=h*100+z*10+e}while(n>1000||seen.has(type+':'+n));seen.add(type+':'+n)}else{[h,z,e]=n===1000?[10,0,0]:d3(n)}return {type,n,h,z,e,parts:n===1000?[10,0,0]:d3(n)}}
function newExam(){const seen=new Set();tasks=shuffle(Object.keys(labels).flatMap(type=>Array.from({length:3},()=>newTask(type,seen))));index=0;results=[];page=0;chosen=null;$('intro').classList.add('hide');$('end').classList.add('hide');$('exam').classList.remove('hide');$('progress').classList.remove('hide');showQuestion()}
function many(className,n){return `<span class="${className}"></span>`.repeat(n)}
function hundreds(n){return `<div class="hundred-grid">${many('hundred',n)}</div>`}
function tens(n){return `<div class="stack">${Array.from({length:Math.ceil(n/5)},(_,i)=>`<div class="ten-stack">${many('ten',Math.min(5,n-i*5))}</div>`).join('')}</div>`}
function ones(n){return `<div class="one-stack">${Array.from({length:Math.ceil(n/10)},(_,i)=>{const k=Math.min(10,n-i*10);return `<div class="one-row"><div class="one-five">${many('one',Math.min(5,k))}</div>${k>5?`<div class="one-five">${many('one',k-5)}</div>`:''}</div>`}).join('')}</div>`}
function dots(n){return `<div class="dots">${many('dot',n)}</div>`}
function blocks(t){return `<div class="three"><div class="box"><div class="box-title">Hundertertafeln</div>${hundreds(t.h)}</div><div class="box"><div class="box-title">Zehnerstangen</div>${tens(t.z)}</div><div class="box"><div class="box-title">Einerwürfel</div>${ones(t.e)}</div></div>`}
function table(t){return `<table class="place-table"><thead><tr><th>H</th><th>Z</th><th>E</th></tr></thead><tbody><tr>${[t.h,t.z,t.e].map(v=>`<td>${dots(v)}</td>`).join('')}</tr></tbody></table>`}
function fields(prefix,amount,labels){return labels.map((text,i)=>`<div class="part"><label for="${prefix+i}">${text}</label><input class="entry" id="${prefix+i}" type="text" inputmode="numeric" autocomplete="off" maxlength="4"></div>${i<amount-1&&prefix==='s'?'<span class="plus">+</span>':''}`).join('')}
function showQuestion(){const t=tasks[index];page=0;chosen=null;$('progress').textContent=`Aufgabe ${index+1} von ${tasks.length}`;$('category').textContent=labels[t.type];$('message').textContent='';$('next').textContent=index===tasks.length-1?'Auswertung':'Weiter';let body='';switch(t.type){case 'find':body=`<div class="prompt">Finde die Zahl: <strong>${t.n}</strong></div><div class="page-head"><button id="prev" aria-label="Vorherige Seite">‹</button><span id="range" class="page-range"></span><button id="forward" aria-label="Nächste Seite">›</button></div><div class="book" id="book"></div><div class="tiny">Wähle die richtige Zahl.</div>`;break;case 'table':body=`<div class="prompt">Welche Zahl zeigt die Stellentafel?</div>${table(t)}<div class="fieldline"><label for="number">Zahl:</label><input class="entry" id="number" type="text" inputmode="numeric" maxlength="4"></div>`;break;case 'split':body=`<div class="large-number">${t.n}</div><div class="parts">${fields('s',3,['Hunderter:','Zehner:','Einer:'])}</div>`;break;case 'count':body=`<div class="large-number">${t.n}</div><div class="three">${['Hundertertafeln','Zehnerstangen','Einerwürfel'].map((lab,i)=>`<div class="box"><div class="box-title">${lab}</div><div style="margin:14px auto 18px">${[hundreds(1),tens(1),ones(1)][i]}</div><input class="entry" id="c${i}" type="text" inputmode="numeric" maxlength="2" aria-label="${lab}"></div>`).join('')}</div>`;break;case 'identify':body=`<div class="prompt">Welche Zahl ist das?</div>${blocks(t)}<div class="fieldline"><label for="number">Zahl:</label><input class="entry" id="number" type="text" inputmode="numeric" maxlength="4"></div>`;break} $('question').innerHTML=body;if(t.type==='find'){$('prev').onclick=()=>{page=Math.max(0,page-1);renderBook()};$('forward').onclick=()=>{page=Math.min(9,page+1);renderBook()};renderBook()}else {$('question').querySelector('input')?.focus({preventScroll:true})}}
function renderBook(){const t=tasks[index];const start=page*100+1;$('range').textContent=`${start}–${start+99}`;$('prev').disabled=page===0;$('forward').disabled=page===9;$('book').innerHTML=Array.from({length:100},(_,i)=>{const v=start+i;return `<button class="${chosen===v?'chosen':''}" data-number="${v}" aria-label="Zahl ${v}" aria-pressed="${chosen===v}">${v}</button>`}).join('');$('book').querySelectorAll('button').forEach(btn=>btn.onclick=()=>{chosen=Number(btn.dataset.number);renderBook()})}
function getAnswer(t){switch(t.type){case'find':return {valid:chosen!==null,ok:chosen===t.n,user:chosen===null?'–':String(chosen)};case'table':case'identify':{const raw=$('number').value.trim();return {valid:/^\d{1,4}$/.test(raw),ok:Number(raw)===t.n,user:raw||'–'}}case'count':case'split':{const prefix=t.type==='count'?'c':'s';const raw=[0,1,2].map(i=>$(prefix+i).value.trim());const expected=t.type==='count'?t.parts:[Math.floor(t.n/100)*100,Math.floor(t.n%100/10)*10,t.n%10];return {valid:raw.every(v=>/^\d{1,4}$/.test(v)),ok:raw.every((v,i)=>Number(v)===expected[i]),user:raw.map(v=>v||'–').join(t.type==='split'?' + ':' · ')}}}}
function saveAnswer(){const t=tasks[index],a=getAnswer(t);if(!a.valid){$('message').textContent=t.type==='find'?'Wähle eine Zahl.':'Fülle die Felder aus.';return}window.SafariTelemetry?.record({task:'Prüfung '+(index+1)+' · '+labels[t.type]+' · '+t.n,correct:a.ok,answer:a.user,expected:expected({...t,...a}),details:'Mathe-Lernkontrolle'});results.push({...t,...a});index++;if(index===tasks.length)showSummary();else showQuestion()}
function smallBook(t){const targetPage=Math.floor((t.n-1)/100),start=targetPage*100+1;return `<div class="page-head"><span class="page-range">${start}–${start+99}</span></div><div class="book">${Array.from({length:100},(_,i)=>`<button class="${start+i===t.n?'correct':''}" tabindex="-1" disabled>${start+i}</button>`).join('')}</div>`}
function explanation(t){switch(t.type){case'find':return `<p>Die Zahl <strong>${t.n}</strong> findest du auf dieser Seite:</p>${smallBook(t)}`;case'table':return `${table(t)}<p>H: ${t.h} · Z: ${t.z} · E: ${t.e}<br><strong>${t.h} Hunderter + ${t.z} Zehner + ${t.e} Einer = ${t.n}</strong></p>`;case'split':return `<p><strong>${t.n} = ${Math.floor(t.n/100)*100} + ${Math.floor(t.n%100/10)*10} + ${t.n%10}</strong></p><p>Hunderterwert + Zehnerwert + Einerwert.</p>`;case'count':return `${blocks(t)}<p><strong>${t.h} H · ${t.z} Z · ${t.e} E</strong> ergeben zusammen ${t.n}.</p>`;case'identify':return `${blocks(t)}<p>${t.h} Hunderter + ${t.z} Zehner + ${t.e} Einer = <strong>${t.n}</strong>.</p>`}}
function expected(t){return t.type==='count'?t.parts.join(' · '):t.type==='split'?[Math.floor(t.n/100)*100,Math.floor(t.n%100/10)*10,t.n%10].join(' + '):String(t.n)}
function showSummary(){$('exam').classList.add('hide');$('progress').classList.add('hide');$('end').classList.remove('hide');let good=results.filter(t=>t.ok).length;$('score').textContent=`${good} von ${tasks.length} richtig`;$('allgood').textContent=good===tasks.length?'Super! Alles richtig!':'Hier kannst du deine Aufgaben nochmals anschauen.';$('review').innerHTML=results.map((t,i)=>`<article class="review-item"><h3 class="${t.ok?'correct-badge':'wrong-badge'}">${i+1}. ${labels[t.type]} – ${t.ok?'Richtig ✓':'Noch üben'}</h3>${t.ok?'':`<p>Deine Antwort: <strong>${t.user}</strong><br>Richtige Lösung: <strong>${expected(t)}</strong></p><div class="mini-view">${explanation(t)}</div>`}</article>`).join('')}
$('start').onclick=newExam;$('restart').onclick=newExam;$('next').onclick=saveAnswer;document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!$('exam').classList.contains('hide')&&e.target.tagName==='INPUT')saveAnswer()});
</script><script defer src="../assets/game-telemetry.js"></script>
</body></html>
