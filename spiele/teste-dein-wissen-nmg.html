<script src="../assets/login-config.js"></script><script src="../assets/nmg-data.js"></script><script src="../assets/game-telemetry.js"></script><script>
(()=>{'use strict'; const $=x=>document.getElementById(x), F=window.NMG_FEATHERS;
const SECTIONS=[
[
 {q:'Welcher Rabenvogel hat einen braun-rosa Körper und leuchtend blaue Federn am Flügel?',visual:'🪶',opts:['Eichelhäher','Elster','Saatkrähe'],a:0,why:'Beim Eichelhäher leuchten die Flügelfedern blau und der Körper ist braun-rosa.'},
 {q:'Wer ist der grösste dieser Rabenvögel?',visual:'📏',opts:['Dohle','Kolkrabe','Tannenhäher'],a:1,why:'Der Kolkrabe wird deutlich grösser als eine Dohle oder ein Tannenhäher.'},
 {q:'Welcher Vogel trägt einen gelben Schnabel und rote Beine?',visual:'🟡',opts:['Alpenkrähe','Rabenkrähe','Alpendohle'],a:2,why:'Die Alpendohle hat einen gelben Schnabel und rote Beine.'},
 {q:'Welcher Rabenvogel ist braun mit vielen weissen Flecken?',visual:'🤎',opts:['Tannenhäher','Elster','Nebelkrähe'],a:0,why:'Die weissen Flecken sind typisch für den Tannenhäher.'},
 {q:'Woran erkennst du eine Nebelkrähe?',visual:'🔍',opts:['Ganz roter Schnabel','Grauer Körper und schwarzer Kopf','Blaue Flügel'],a:1,why:'Die Nebelkrähe ist grau und schwarz.'},
 {q:'Welche Aussage über die Dohle stimmt?',visual:'👀',opts:['Sie hat oft helle Augen','Sie ist der grösste Rabenvogel','Sie hat rote Beine'],a:0,why:'Typisch für die Dohle sind die hellen Augen.'}
],
[
 {q:'Eine Hecke verschwindet. Was fehlt den Vögeln oft?',visual:'🌿',opts:['Schutz und Nistplatz','Die Sonne','Der Wind'],a:0,why:'Hecken bieten Verstecke und Nistplätze.'},
 {q:'Was kann passieren, wenn es immer weniger Insekten gibt?',visual:'🐛',opts:['Die Vögel brauchen keine Nahrung mehr','Viele Vögel finden weniger Futter','Alle Nester werden grösser'],a:1,why:'Viele Vögel füttern ihre Jungen mit Insekten.'},
 {q:'Wobei hilft eine sichtbare Markierung auf einem grossen Fenster?',visual:'🪟',opts:['Sie macht Glas für Vögel erkennbar','Sie hält Bäume vom Wachsen ab','Sie macht Nester wärmer'],a:0,why:'So fliegen Vögel seltener gegen die Scheibe.'},
 {q:'Wo findet die Alpendohle passende Lebensräume?',visual:'⛰️',opts:['Nur am Meeresgrund','Hoch in den Bergen','Nur in dunklen Höhlen'],a:1,why:'Alpendohlen leben besonders im Gebirge.'},
 {q:'Warum sind wilde Blumenwiesen wertvoll?',visual:'🌼',opts:['Sie haben nur eine Pflanzenart','Sie lassen alle Vögel wegfliegen','Sie bieten Insekten Nahrung'],a:2,why:'Viele Blumen bedeuten oft mehr Insekten und damit mehr Vogelfutter.'},
 {q:'Was tust du beim Entdecken eines Vogelnests?',visual:'🪹',opts:['Ruhig Abstand halten','Das Nest verschieben','Die Eier berühren'],a:0,why:'Vögel sollen beim Brüten nicht gestört werden.'}
],
[
 {q:'Ein Vogel will beim Fliegen lenken. Welche Feder nutzt er?',visual:'steuer',opts:['Daunenfeder','Steuerfeder','Deckfeder'],a:1,why:'Steuerfedern am Schwanz helfen beim Lenken.'},
 {q:'Welche Feder hält besonders warm?',visual:'daune',opts:['Daunenfeder','Schwungfeder','Steuerfeder'],a:0,why:'Daunenfedern halten den Körper warm.'},
 {q:'Wo sitzen die langen Schwungfedern?',visual:'schwung',opts:['Am Schnabel','An den Flügeln','An den Beinen'],a:1,why:'Schwungfedern sitzen am Flügel und helfen beim Fliegen.'},

 {q:'Welche Aussage über Federn ist richtig?',visual:'🪶',opts:['Alle Federn erfüllen genau dieselbe Aufgabe','Verschiedene Federn haben verschiedene Aufgaben','Vögel brauchen nur eine Feder'],a:1,why:'Ein Vogel braucht unterschiedliche Federn zum Fliegen, Lenken, Schützen und Warmhalten.'}
]
];
const sections=['Rabenvögel','Lebensraum','Federn']; let sec=0,pos=0,answer=-1,locked=false,scores=[0,0,0],errors=[];
function render(){ if(pos===6){sec++; pos=0; if(sec===3)return finish();} $('progress').textContent=`Aufgabe ${sec*6+pos+1} von 18`; $('bar').style.width=`${(sec*6+pos)/18*100}%`; for(let j=0;j<3;j++) $('tag'+(j+1)).style.background=j===sec?'#51864e':'#ebf4e5', $('tag'+(j+1)).style.color=j===sec?'#fff':'#4b7146'; const q=SECTIONS[sec][pos]; answer=-1; locked=false; $('question').textContent=q.q; $('visual').innerHTML=F.some(x=>x.id===q.visual)?`<img src="../assets/federn/${q.visual}.png" alt="Federbild">`:`<div class="big" aria-hidden="true">${q.visual}</div>`; const bank=q.opts.map((x,i)=>({x,i})); for(let i=bank.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [bank[i],bank[j]]=[bank[j],bank[i]];} $('answers').innerHTML=''; bank.forEach(row=>{const el=document.createElement('button'); el.type='button'; el.dataset.index=String(row.i); el.textContent=row.x; el.addEventListener('click',()=>{if(locked)return; answer=row.i; [...$('answers').children].forEach(a=>a.classList.toggle('selected',a===el));}); $('answers').append(el);}); $('message').textContent=''; $('message').className='message'; $('check').classList.remove('hide'); $('next').classList.add('hide'); }
function check(){ if(locked||answer===-1)return; locked=true; const q=SECTIONS[sec][pos], ok=answer===q.a; scores[sec]+=+ok; if(!ok) errors.push({part:sections[sec],why:q.why}); [...$('answers').children].forEach(btn=>{const v=Number(btn.dataset.index); if(v===q.a)btn.classList.add('correct'); if(v===answer&&!ok)btn.classList.add('wrong'); btn.disabled=true;}); $('message').textContent=(ok?'✓ Richtig! ':'✕ Das war noch nicht richtig. ')+q.why; $('message').className='message '+(ok?'good':''); $('check').classList.add('hide'); $('next').classList.remove('hide'); $('next').textContent=sec===2&&pos===5?'Ergebnis ansehen':(pos===5?'Nächster Teil':'Weiter'); window.SafariTelemetry?.record({task:`NMG Wissen ${sections[sec]} Frage ${pos+1}`,correct:ok,answer:q.opts[answer],expected:q.opts[q.a],details:q.q}); }
function finish(){ $('exam').classList.add('hide'); $('end').classList.remove('hide'); const points=scores.reduce((a,b)=>a+b,0); $('score').textContent=`${points} / 18`; $('by-part').innerHTML=sections.map((x,i)=>`<p><b>${x}</b>: ${scores[i]} von 6 richtig</p>`).join(''); $('tips').innerHTML=errors.length?errors.slice(0,12).map(e=>`<p><b>${e.part}:</b> ${e.why}</p>`).join(''):'<p>Alles richtig! Super gemacht!</p>'; window.SafariTelemetry?.record({task:'NMG Teste dein Wissen Abschluss',correct:points===18,correctCount:points,total:18,answer:`${points}/18 Punkte`,expected:'18/18 Punkte',details:'Drei Prüfungsteile'}); }
$('check').addEventListener('click',check); $('next').addEventListener('click',()=>{pos++; render();}); $('restart').addEventListener('click',()=>{sec=0; pos=0; answer=-1; locked=false; scores=[0,0,0]; errors=[]; $('exam').classList.remove('hide'); $('end').classList.add('hide'); render();}); render();
})();
