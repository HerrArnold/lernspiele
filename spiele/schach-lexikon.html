<style>
:root{--green:#587941;--pink:#d85c8f;--sand:#fbf5e7;--brown:#6f5238;--line:#e4d7bd;--board-light:#f5e7c6;--board-dark:#c69e67;--accent:#8bb46f}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:linear-gradient(180deg,#fcf8ef,#f4ecd9);color:#2e2b27}.shell{max-width:1260px;margin:0 auto;padding:16px 18px 28px}.hero{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;flex-wrap:wrap}.hero h1{margin:0;color:#4b6137;font-size:clamp(28px,3vw,42px)}.hero p{margin:8px 0 0;color:#6a573f;font-size:18px}.hero-badge{background:#fff;border:1px solid var(--line);border-radius:18px;padding:10px 14px;font-weight:800}.layout{display:grid;grid-template-columns:320px 1fr;gap:18px;margin-top:18px}.card{background:rgba(255,255,255,.94);border:1px solid #eadfc8;border-radius:24px;box-shadow:0 12px 36px rgba(90,76,34,.08);padding:16px}.card h2{margin:0 0 12px;color:#566a3a}.mode-switch{display:flex;gap:10px;margin-bottom:12px}.mode-switch button,.entry-grid button{font:inherit;cursor:pointer}.mode-btn{flex:1;border:2px solid #eadfc8;background:#fff;border-radius:16px;padding:11px 12px;font-weight:800}.mode-btn.active{background:#fff0f6;border-color:#d85c8f}.entry-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.entry-btn{display:flex;align-items:center;gap:10px;text-align:left;border:2px solid #eadfc8;background:#fff;border-radius:16px;padding:10px}.entry-btn.active{border-color:#87a96b;background:#f6fbf3}.entry-icon{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:#f7f2e2}.entry-name{font-weight:800}.entry-sub{font-size:13px;color:#7b6954}.small-note{margin-top:14px;background:#f9f4e4;border-radius:16px;padding:12px 14px;font-size:14px;color:#6f5b44;line-height:1.45}.content{display:grid;grid-template-columns:1fr 360px;gap:18px;align-items:start}.info-panel{background:#fffaf0;border:1px solid #ebdfc4;border-radius:18px;padding:16px}.info-panel h3{margin:0;font-size:30px;color:#50653a}.info-panel p{color:#684f37;line-height:1.45}.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.chip{display:inline-block;background:#eaf4e7;color:#376540;padding:7px 11px;border-radius:999px;font-size:14px;font-weight:800}.mini-cards{display:grid;gap:10px;margin-top:12px}.mini{display:flex;gap:10px;background:#fff;border:1px solid #eadfc8;border-radius:16px;padding:10px 12px}.mini strong{display:block;color:#4f6138}.mini span{font-size:14px;color:#715b44}.board-card{display:flex;flex-direction:column;align-items:center;gap:12px}.board-frame{display:grid;grid-template-columns:24px 1fr 24px;grid-template-rows:24px 1fr 24px;gap:6px;align-items:center}.letters{display:grid;grid-template-columns:repeat(8,1fr);gap:0;font-weight:800;color:#6c573f;font-size:14px}.numbers{display:grid;grid-template-rows:repeat(8,1fr);height:100%;font-weight:800;color:#6c573f;font-size:14px}.numbers span,.letters span{display:grid;place-items:center}.board{width:min(520px, calc(100vw - 140px));max-width:520px;display:grid;grid-template-columns:repeat(8,1fr);border:8px solid #a97d49;border-radius:20px;overflow:hidden;box-shadow:0 14px 32px rgba(56,45,25,.22)}.sq{aspect-ratio:1/1;display:grid;place-items:center;position:relative}.light{background:var(--board-light)}.dark{background:var(--board-dark)}.target::before{content:"";width:22%;height:22%;border-radius:50%;background:rgba(61,139,87,.82);position:absolute}.capture::before{content:"";position:absolute;inset:8%;border:4px solid rgba(176,72,72,.92);border-radius:50%}.checksq{background:#ffd1d1!important}.focus{outline:4px solid #ff7ab4;outline-offset:-4px}.piece-token{width:72%;height:72%;border-radius:50%;display:grid;place-items:center;font-size:clamp(24px,3vw,38px);font-weight:800;box-shadow:0 3px 8px rgba(0,0,0,.15)}.piece-token.white{background:#fff;color:#111;border:2px solid #515151}.piece-token.black{background:#222;color:#fff;border:2px solid #f7f7f7}.legend{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;font-size:14px;color:#6e5b44}.legend-item{display:flex;align-items:center;gap:8px}.dot,.ring{width:18px;height:18px;border-radius:50%}.dot{background:rgba(61,139,87,.82)}.ring{border:4px solid rgba(176,72,72,.92)}@media(max-width:1020px){.layout{grid-template-columns:1fr}.content{grid-template-columns:1fr}.board{max-width:620px}}@media(max-width:640px){.shell{padding:14px 10px 24px}.entry-grid{grid-template-columns:1fr 1fr}.info-panel h3{font-size:26px}.board{width:min(520px, calc(100vw - 72px))}}
</style>
<link rel="stylesheet" href="../assets/lernsafari-dark.css?v=3"><link rel="stylesheet" href="../assets/lernsteuerung.css?v=1"><script defer src="../assets/lernsteuerung.js?v=1"></script><script defer src="../assets/lernhelfer.js?v=1"></script></head>
<body>
<div class="safari-exit-bar"><span>Lernsafari</span><a href="../index.html#aktuelle--allgemein">✕ Spiel beenden</a></div>
<main class="shell">
  <section class="hero">
    <div>
      <h1>Schach-Lexikon</h1>
      <p>Klicke auf Figuren und Regeln. So lernst du Schach Schritt für Schritt.</p>
    </div>
    <div class="hero-badge">Alles auf einen Blick ♟️</div>
  </section>

  <section class="layout">
    <aside class="card">
      <div class="mode-switch">
        <button type="button" class="mode-btn active" data-mode="pieces">Figuren</button>
        <button type="button" class="mode-btn" data-mode="rules">Regeln</button>
      </div>
      <div class="entry-grid" id="entry-grid"></div>
      <div class="small-note">Tipp: Auf dem Brett zeigen grüne Punkte erlaubte Züge. Rote Ringe zeigen Felder, auf denen geschlagen wird.</div>
    </aside>

    <section class="card content">
      <div class="board-card">
        <div class="board-frame">
          <div></div><div class="letters" id="letters-top"></div><div></div>
          <div class="numbers" id="numbers-left"></div><div class="board" id="board"></div><div class="numbers" id="numbers-right"></div>
          <div></div><div class="letters" id="letters-bottom"></div><div></div>
        </div>
        <div class="legend"><span class="legend-item"><span class="dot"></span> dorthin ziehen</span><span class="legend-item"><span class="ring"></span> dort schlagen</span></div>
      </div>

      <div class="info-panel">
        <h3 id="title"></h3>
        <p id="text"></p>
        <div class="chips" id="chips"></div>
        <div class="mini-cards" id="mini-cards"></div>
      </div>
    </section>
  </section>
</main>
<script src="../assets/chess-common.js?v=kingfix-20261108"></script>
<script>
'use strict';
const C=window.ChessSafari;
const letters='abcdefgh'.split(''); const numbers=['8','7','6','5','4','3','2','1'];
function fillAxes(){for(const id of ['letters-top','letters-bottom'])document.getElementById(id).innerHTML=letters.map(x=>`<span>${x}</span>`).join('');for(const id of ['numbers-left','numbers-right'])document.getElementById(id).innerHTML=numbers.map(x=>`<span>${x}</span>`).join('');}
function white(t){return t.toUpperCase()} function black(t){return t.toLowerCase()}
function stateFromPieces(pieces,turn='w'){const s={board:Array(64).fill(''),turn,castle:{K:false,Q:false,k:false,q:false},ep:-1,halfmove:0,fullmove:1}; for(const [sq,p] of pieces)s.board[C.parseSquare(sq)]=p; return s;}
const PIECES=[
 {id:'pawn',name:'Bauer',icon:'♙',sub:'gerade vorwärts',text:'Der Bauer geht meistens ein Feld vorwärts. Beim ersten Zug darf er zwei Felder gehen. Schlagen darf er nur schräg nach vorne.',chips:['1 Feld vorwärts','beim ersten Zug 2 Felder','schlägt schräg'],tips:[['Merksatz','Gerade gehen, schräg schlagen.'],['Gut zu wissen','Erreicht ein Bauer die letzte Reihe, darf er sich verwandeln.']],view(){const state=stateFromPieces([['d4','P'],['c5','p'],['e5','p']]);const focus=C.parseSquare('d4');return {state,focus,moves:rawMoves(state,focus)};}},
 {id:'knight',name:'Springer',icon:'♘',sub:'springt im L',text:'Der Springer springt zwei Felder in eine Richtung und dann eins zur Seite. Er darf über andere Figuren hüpfen.',chips:['L-Form','kann hüpfen'],tips:[['Merksatz','Zwei und eins – das ist der Springer.'],['Achtung','Er darf sogar über andere Figuren springen.']],view(){const state=stateFromPieces([['d4','N'],['c6','P'],['c2','p'],['e2','p']]);const focus=C.parseSquare('d4');return {state,focus,moves:rawMoves(state,focus)};}},
 {id:'bishop',name:'Läufer',icon:'♗',sub:'diagonal',text:'Der Läufer zieht diagonal, so weit er möchte. Er kann nicht über Figuren springen.',chips:['diagonal','beliebig weit'],tips:[['Merksatz','Der Läufer bleibt immer auf derselben Feldfarbe.'],['Achtung','Steht eine Figur im Weg, muss er stoppen.']],view(){const state=stateFromPieces([['d4','B'],['f6','p'],['b6','P'],['f2','p']]);const focus=C.parseSquare('d4');return {state,focus,moves:rawMoves(state,focus)};}},
 {id:'rook',name:'Turm',icon:'♖',sub:'gerade Linien',text:'Der Turm zieht gerade nach vorne, hinten, links oder rechts. Auch er kann nicht springen.',chips:['gerade','beliebig weit'],tips:[['Merksatz','Der Turm fährt wie auf Schienen.'],['Gut zu wissen','Mit dem König zusammen kann er rochieren.']],view(){const state=stateFromPieces([['d4','R'],['d6','P'],['g4','p'],['d1','p']]);const focus=C.parseSquare('d4');return {state,focus,moves:rawMoves(state,focus)};}},
 {id:'queen',name:'Dame',icon:'♕',sub:'sehr stark',text:'Die Dame kombiniert Turm und Läufer. Sie darf gerade und diagonal ziehen – so weit sie möchte.',chips:['gerade','diagonal','beliebig weit'],tips:[['Merksatz','Die Dame ist die stärkste Figur.'],['Achtung','Trotzdem darf sie nicht springen.']],view(){const state=stateFromPieces([['d4','Q'],['d7','p'],['g7','p'],['a4','P']]);const focus=C.parseSquare('d4');return {state,focus,moves:rawMoves(state,focus)};}},
 {id:'king',name:'König',icon:'♔',sub:'1 Feld',text:'Der König zieht genau ein Feld in eine beliebige Richtung. Er darf nie auf ein bedrohtes Feld ziehen.',chips:['1 Feld','alle Richtungen'],tips:[['Merksatz','Den König musst du beschützen.'],['Wichtig','Wenn der König matt ist, ist die Partie vorbei.']],view(){const state=stateFromPieces([['e4','K'],['f5','p'],['d3','p']]);const focus=C.parseSquare('e4');return {state,focus,moves:C.legalMoves(state).filter(m=>m.from===focus)};}}
];
const RULES=[
 {id:'goal',name:'Spielziel',icon:'🎯',sub:'Schachmatt',text:'Das Ziel ist Schachmatt: Der gegnerische König ist bedroht und kann nicht mehr fliehen.',chips:['König angreifen','kein Fluchtfeld'],tips:[['Merksatz','Schachmatt beendet die Partie.'],['Beispiel','Hier ist der schwarze König matt.']],view(){const state=C.fromFEN('7k/6Q1/6K1/8/8/8/8/8 b - - 0 1');return {state,focus:C.parseSquare('h8'),moves:[],red:[C.parseSquare('h8')]};}},
 {id:'start',name:'Wer beginnt?',icon:'⚪',sub:'Weiss beginnt',text:'Weiss macht immer den ersten Zug. Danach ziehen Weiss und Schwarz abwechselnd.',chips:['Weiss beginnt','abwechseln'],tips:[['Merksatz','Hell startet zuerst.'],['Bildidee','Die weissen Figuren stehen unten, die schwarzen oben.']],view(){const state=C.startState();return {state,focus:null,moves:[]};}},
 {id:'check',name:'Schach',icon:'⚠️',sub:'König bedroht',text:'Steht dein König im Schach, musst du sofort reagieren: wegziehen, schlagen oder abdecken.',chips:['sofort reagieren'],tips:[['Merksatz','Schach darf nie stehen bleiben.'],['Beispiel','Der weisse Turm bedroht den schwarzen König.']],view(){const state=C.fromFEN('4k3/8/8/8/4R3/8/8/4K3 b - - 0 1');return {state,focus:C.parseSquare('e8'),moves:[],red:[C.parseSquare('e8')]};}},
 {id:'castle',name:'Rochade',icon:'🏰',sub:'König + Turm',text:'Bei der Rochade geht der König zwei Felder zum Turm. Der Turm springt direkt neben ihn.',chips:['Spezialzug','König und Turm'],tips:[['Merksatz','Die Rochade bringt den König in Sicherheit.'],['Wichtig','Das geht nur, wenn noch niemand gezogen hat und nichts im Weg steht.']],view(){const state=C.fromFEN('4k3/8/8/8/8/8/8/4K2R w K - 0 1');const focus=C.parseSquare('e1');return {state,focus,moves:[{from:focus,to:C.parseSquare('g1'),piece:'K',castle:'K'}]};}},
 {id:'enpassant',name:'En Passant',icon:'🧩',sub:'im Vorbeigehen',text:'Zieht ein Bauer zwei Felder vor und landet neben deinem Bauern, darfst du ihn sofort im Vorbeigehen schlagen.',chips:['nur sofort danach'],tips:[['Merksatz','En passant heisst: im Vorbeigehen.'],['Beispiel','Der weisse Bauer darf nach d6 schlagen.']],view(){const state=C.fromFEN('4k3/8/8/3pP3/8/8/8/4K3 w - d6 0 1');const focus=C.parseSquare('e5');return {state,focus,moves:[{from:focus,to:C.parseSquare('d6'),piece:'P',capture:'p',enPassant:true}]};}},
 {id:'promotion',name:'Verwandlung',icon:'✨',sub:'Bauer wird stärker',text:'Erreicht ein Bauer die letzte Reihe, darf er sich in Dame, Turm, Läufer oder Springer verwandeln.',chips:['Dame','Turm','Läufer','Springer'],tips:[['Merksatz','Ganz vorne wird der Bauer stärker.'],['Tipp','Meistens wählt man die Dame.']],view(){const state=stateFromPieces([['e7','P'],['e1','K'],['h8','k']]);const focus=C.parseSquare('e7');return {state,focus,moves:[{from:focus,to:C.parseSquare('e8'),piece:'P',promotion:'q'}]};}}
];
let mode='pieces'; let active=0;
function activeList(){return mode==='pieces'?PIECES:RULES}
function renderButtons(){document.querySelectorAll('.mode-btn').forEach(btn=>btn.classList.toggle('active',btn.dataset.mode===mode)); const host=document.getElementById('entry-grid'); host.innerHTML=activeList().map((entry,i)=>`<button class="entry-btn ${i===active?'active':''}" data-index="${i}" type="button"><span class="entry-icon">${entry.icon}</span><span><span class="entry-name">${entry.name}</span><br><span class="entry-sub">${entry.sub}</span></span></button>`).join(''); host.querySelectorAll('[data-index]').forEach(btn=>btn.addEventListener('click',()=>{active=Number(btn.dataset.index);renderAll();}));}
function pieceMarkup(ch){if(!ch)return '';const col=ch===ch.toUpperCase()?'white':'black';return `<span class="piece-token ${col}">${C.unicode[ch]}</span>`}
function rawMoves(state,from){
  const board=state.board||[];const piece=board[from];if(!piece)return [];
  const color=piece===piece.toUpperCase()?'w':'b';const enemy=color==='w'?'b':'w';const type=piece.toLowerCase();
  const f=C.sqFile(from), r=C.sqRank(from); const moves=[];
  const add=(to,capture=false,extra={})=>moves.push({from,to,piece,capture:capture?(board[to]||extra.capture||true):null,...extra});
  const enemyAt=(to)=>board[to]&&((board[to]===board[to].toUpperCase())?'w':'b')===enemy;
  if(type==='p'){
    const dir=color==='w'?-1:1; const start=color==='w'?6:1;
    const oneR=r+dir; if(oneR>=0&&oneR<8){ const one=C.idx(f,oneR); if(!board[one]){ add(one,false); if(r===start){ const twoR=r+2*dir; const two=C.idx(f,twoR); if(!board[two]) add(two,false,{double:true}); } }
      for(const df of [-1,1]){ const ff=f+df; if(ff<0||ff>7) continue; const to=C.idx(ff,oneR); if(enemyAt(to)) add(to,true); }
    }
    return moves;
  }
  if(type==='n'){
    for(const [df,dr] of [[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]]){ const ff=f+df, rr=r+dr; if(ff<0||ff>7||rr<0||rr>7) continue; const to=C.idx(ff,rr); if(!board[to]) add(to,false); else if(enemyAt(to)) add(to,true); }
    return moves;
  }
  if(type==='k'){
    for(let df=-1;df<=1;df++)for(let dr=-1;dr<=1;dr++){ if(!df&&!dr) continue; const ff=f+df, rr=r+dr; if(ff<0||ff>7||rr<0||rr>7) continue; const to=C.idx(ff,rr); if(!board[to]) add(to,false); else if(enemyAt(to)) add(to,true); }
    return moves;
  }
  const dirs=[];
  if(type==='b'||type==='q') dirs.push([1,1],[1,-1],[-1,1],[-1,-1]);
  if(type==='r'||type==='q') dirs.push([1,0],[-1,0],[0,1],[0,-1]);
  for(const [df,dr] of dirs){
    let ff=f+df, rr=r+dr;
    while(ff>=0&&ff<8&&rr>=0&&rr<8){ const to=C.idx(ff,rr); if(!board[to]) add(to,false); else { if(enemyAt(to)) add(to,true); break; } ff+=df; rr+=dr; }
  }
  return moves;
}
function renderBoard(view){const host=document.getElementById('board'); host.innerHTML=''; const targetTo=new Map(); (view.moves||[]).forEach(m=>targetTo.set(m.to,m.capture?'capture':'target')); const redSet=new Set(view.red||[]); for(let r=0;r<8;r++)for(let f=0;f<8;f++){const sq=C.idx(f,r);const d=document.createElement('div');d.className=`sq ${(r+f)%2?'dark':'light'}`; if(sq===view.focus)d.classList.add('focus'); if(redSet.has(sq))d.classList.add('checksq'); if(targetTo.has(sq))d.classList.add(targetTo.get(sq)); d.innerHTML=pieceMarkup(view.state.board[sq]||''); host.append(d);} }
function renderInfo(){const entry=activeList()[active]; const view=entry.view(); document.getElementById('title').textContent=`${entry.icon} ${entry.name}`; document.getElementById('text').textContent=entry.text; document.getElementById('chips').innerHTML=entry.chips.map(c=>`<span class="chip">${c}</span>`).join(''); document.getElementById('mini-cards').innerHTML=entry.tips.map(([a,b])=>`<div class="mini"><div>💡</div><div><strong>${a}</strong><span>${b}</span></div></div>`).join(''); renderBoard(view);}
function renderAll(){renderButtons();renderInfo();}
document.querySelectorAll('.mode-btn').forEach(btn=>btn.addEventListener('click',()=>{mode=btn.dataset.mode;active=0;renderAll();}));
fillAxes(); renderAll();
</script>
</body>
