<!doctype html><html lang="de-CH"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Federtypen – LernSafari</title><link rel="stylesheet" href="../assets/game-theme.css"><link rel="stylesheet" href="../assets/nmg-game.css"><script defer src="../assets/analytics-config.js"></script><link rel="stylesheet" href="../assets/lernsafari-dark.css?v=1"></head><body><div class="safari-exit-bar"><span>LernSafari · NMG</span><a href="../index.html#aktuelle--nmg">✕ Spiel beenden</a></div><main class="game-shell"><div class="nmg-heading"><div><h1>🪶 Federtypen</h1><p>Schau genau hin: Welche Feder ist das? Wofür braucht ein Vogel sie?</p></div><span class="nmg-status" id="status">Teil 1 von 2</span></div><div class="nmg-steps"><span id="step1" class="active">1 · Feder erkennen</span><span id="step2">2 · Feder verstehen</span></div><section class="nmg-card" id="play"><div class="nmg-progress"><span id="bar"></span></div><h2 id="part-title">Welche Feder ist das?</h2><p id="task" class="nmg-question"></p><div class="nmg-illustration" id="image"></div><div class="nmg-choicegrid" id="options" style="margin-top:14px"></div><div class="nmg-fb" id="feedback" aria-live="polite"></div><div class="nmg-actions"><button class="nmg-btn" id="check">Antwort prüfen</button><button class="nmg-btn ghost nmg-hidden" id="next">Weiter</button></div></section><section id="done" class="nmg-card nmg-results nmg-hidden"><h2>🎉 Federprofi!</h2><p>Du kennst jetzt die verschiedenen Federn.</p><p><strong id="result"></strong></p><button class="nmg-btn" onclick="location.reload()">Nochmals spielen</button></section></main>
<script src="../assets/login-config.js"></script><script src="../assets/nmg-data.js"></script><script src="../assets/game-telemetry.js"></script>
<script>
(()=>{'use strict';const $=x=>document.getElementById(x),F=window.NMG_FEATHERS;
const EASY=[...F,...F].sort(()=>Math.random()-.5);
const HARD=[
 ['Welche Feder hält den Körper warm?','daune','Daunenfedern halten den Körper warm.'],
 ['Welche Feder schützt vor Wasser, Staub und Schmutz?','deck','Deckfedern schützen den Körper und liegen aussen.'],
 ['Welche Feder sitzt am Flügel und hilft beim Fliegen?','schwung','Schwungfedern sitzen am Flügel und helfen beim Fliegen.'],
 ['Welche Feder sitzt am Schwanz und hilft beim Lenken?','steuer','Steuerfedern sitzen am Schwanz und helfen beim Lenken.'],
 ['Bei welcher Feder ist eine Seite der Fahne schmaler als die andere?','schwung','Bei Schwungfedern sind die beiden Seiten nicht gleich breit.'],
 ['Welche Feder hat eher gleichmässige Federfahnen?','steuer','Steuerfedern haben recht gleichmässige Federfahnen.'],
 ['Welche Feder kann auch bei Tarnung oder Schmuck helfen?','deck','Deckfedern können schützen, tarnen oder schmücken.'],
 ['Welche Feder ist weich und flauschig?','daune','Daunenfedern sind weich und flauschig.'],
 ['Ein Vogel bremst im Flug. Welche Feder hilft dabei?','steuer','Steuerfedern helfen beim Lenken und Bremsen.'],
 ['Welche Feder braucht ein Vogel besonders für Auftrieb und Vorwärtskommen?','schwung','Schwungfedern helfen besonders beim Fliegen.']
 ];
let part=0,index=0,good=0,choice=null,locked=false;
function img(id){return `../assets/federn/${id}.png`}
function show(){ if(part===0&&index>=EASY.length){part=1; index=0; $('step1').classList.remove('active'); $('step2').classList.add('active'); $('status').textContent='Teil 2 von 2';} else if(part===1&&index>=HARD.length){return finish();} locked=false; choice=null; const f=part===0?EASY[index]:F.find(x=>x.id===HARD[index][1]); $('part-title').textContent=part===0?'Wie heisst diese Feder?':'Wozu braucht man sie?'; $('task').textContent=part===0?'Schau auf das Bild. Wie heisst diese Feder?':HARD[index][0]; $('image').innerHTML=`<img alt="Federbild" class="nmg-featherimg" style="height:220px;max-width:360px" src="${img(f.id)}">`; $('options').innerHTML=''; const options=F.slice().sort(()=>Math.random()-.5); options.forEach(o=>{const b=document.createElement('button'); b.type='button'; b.className='nmg-option'; b.textContent=o.name; b.dataset.id=o.id; b.addEventListener('click',()=>{if(locked)return; choice=o.id; [...$('options').children].forEach(x=>x.classList.remove('selected')); b.classList.add('selected');}); $('options').append(b);}); $('feedback').textContent=''; $('feedback').className='nmg-fb'; $('check').classList.remove('nmg-hidden'); $('next').classList.add('nmg-hidden'); $('bar').style.width=`${(part===0?index:8+index)/18*100}%`; }
function check(){ if(!choice||locked)return; const wanted=part===0?EASY[index]:F.find(x=>x.id===HARD[index][1]); const ok=choice===wanted.id; good+=+ok; locked=true; [...$('options').children].forEach(btn=>{ if(btn.dataset.id===wanted.id)btn.classList.add('correct'); if(btn.dataset.id===choice&&!ok)btn.classList.add('wrong'); }); const text=part===0?wanted.description:HARD[index][2]; $('feedback').textContent=(ok?'✓ Richtig! ':'✕ Die richtige Antwort ist '+wanted.name+'. ')+text; $('feedback').className='nmg-fb '+(ok?'good':'bad'); window.SafariTelemetry?.record({task:`Federtypen Teil ${part+1} Aufgabe ${index+1}`,correct:ok,answer:F.find(x=>x.id===choice)?.name,expected:wanted.name,details:part===0?'Federn am Bild erkennen':HARD[index][0]}); $('check').classList.add('nmg-hidden'); $('next').classList.remove('nmg-hidden'); $('next').textContent=part===1&&index===9?'Auswertung':'Weiter'; }
function finish(){ $('play').classList.add('nmg-hidden'); $('done').classList.remove('nmg-hidden'); $('result').textContent=`${good} von 18 Aufgaben richtig.`; window.SafariTelemetry?.record({task:'Federtypen Abschluss',correct:good===18,correctCount:good,total:18,answer:`${good}/18`,expected:'18/18'}); }
$('check').addEventListener('click',check); $('next').addEventListener('click',()=>{index++; show();}); show();})();
</script></body></html>
