<!doctype html><html lang="de-CH"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Lebensraum der Vögel – LernSafari</title><link rel="stylesheet" href="../assets/game-theme.css"><link rel="stylesheet" href="../assets/nmg-game.css"><script defer src="../assets/analytics-config.js"></script><link rel="stylesheet" href="../assets/lernsafari-dark.css?v=1"></head><body><div class="safari-exit-bar"><span>LernSafari · NMG</span><a href="../index.html#aktuelle--nmg">✕ Spiel beenden</a></div><main class="game-shell"><div class="nmg-heading"><div><h1>🌳 Lebensraum der Vögel</h1><p>Was brauchen Vögel zum Leben? Was schadet ihnen?</p></div><span id="status" class="nmg-status">Teil 1 von 2</span></div><div class="nmg-steps"><span id="step1" class="active">1 · Einfach</span><span id="step2">2 · Knifflig</span></div>
<section id="game" class="nmg-card"><div class="nmg-progress"><span id="bar"></span></div><h2 id="heading"></h2><div class="nmg-illustration" id="picture"></div><p class="nmg-question" id="question"></p><div class="nmg-choicegrid" id="options"></div><div class="nmg-fb" id="feedback" aria-live="polite"></div><div class="nmg-actions"><button class="nmg-btn" id="check">Antwort prüfen</button><button class="nmg-btn ghost nmg-hidden" id="next">Weiter</button></div></section>
<section id="done" class="nmg-card nmg-results nmg-hidden"><h2>🎉 Geschafft!</h2><p>Du weisst, wie wir Vögeln und Rabenvögeln helfen können.</p><p><strong id="result"></strong></p><button class="nmg-btn" onclick="location.reload()">Nochmals spielen</button></section></main>
<script src="../assets/login-config.js"></script><script src="../assets/game-telemetry.js"></script>
<script>
(()=>{'use strict';const $=x=>document.getElementById(x);const EASY=[
 ['🌲','Wofür brauchen viele Vögel Bäume?',['Für Nester und Schutz','Damit sie nicht mehr fliegen müssen'],0,'In Bäumen können Vögel brüten und sich verstecken.'],
 ['🐛','Warum sind Insekten wichtig?',['Viele Vögel fressen sie','Sie sind nur für Fische wichtig'],0,'Viele Vögel fressen Insekten. Junge Vögel brauchen oft besonders viele.'],
 ['💧','Was brauchen alle Vögel?',['Sauberes Wasser','Plastikabfall'],0,'Vögel brauchen Wasser zum Trinken und Baden.'],
 ['🪹','Wo ist ein Nest gut geschützt?',['In einer ruhigen Hecke','Mitten auf einer lauten Strasse'],0,'Hecken bieten Schutz vor Wind und Feinden.'],
 ['🧴','Was schadet vielen Vögeln?',['Gift auf Wiesen und Feldern','Viele verschiedene Pflanzen'],0,'Gift kann Insekten töten und so Vögeln die Nahrung wegnehmen.'],
 ['🪟','Was ist gefährlich für Vögel?',['Unsichtbares Fensterglas','Ein Baum mit Blättern'],0,'Vögel können gegen Glasscheiben fliegen.'],
 ['🍂','Was hilft Insekten und Vögeln?',['Wilde Ecken im Garten','Alle Pflanzen wegschneiden'],0,'In wilden Ecken finden Insekten Verstecke und Nahrung.'],
 ['🗑️','Was machen wir mit Abfall?',['In den Abfalleimer werfen','In der Natur liegen lassen'],0,'Plastik und andere Abfälle können Tiere verletzen.'],
 ['🌾','Wo sucht die Saatkrähe oft Futter?',['Auf Feldern und Wiesen','Nur tief im See'],0,'Sie sucht am Boden nach Würmern, Insekten und Körnern.'],
 ['⛰️','Wo lebt die Alpendohle besonders gern?',['In den Bergen','Im Meer'],0,'Alpendohlen fühlen sich hoch in den Alpen wohl.']
 ];const HARD=[
 ['🌻','Eine Wiese hat viele Blumen. Was hilft den Vögeln?',['Blumen lassen Insekten leben','Alle Blumen sofort abschneiden','Die Wiese mit Gift besprühen'],0,'Blumen bieten Insekten Nahrung. Vögel fressen diese Insekten.'],
 ['🏡','Eine alte Baumhöhle wird entdeckt. Was ist klug?',['Baumhöhle stehen lassen, wenn sicher','Die Höhle sofort verschliessen','Jeden Tag hineinschauen'],0,'Einige Vögel brüten in Höhlen. Eine ruhige Höhle ist wertvoll.'],
 ['🏢','Dohlen suchen Nistplätze in einer Stadt. Was hilft?',['Geeignete Nistplätze an Gebäuden','Alle Nischen verschliessen','Ständig Feuerwerk zünden'],0,'Dohlen brüten gerne in Hohlräumen und Nischen.'],
 ['🐦','Ein Jungvogel sitzt im Gebüsch. Wie reagierst du?',['Abstand halten und beobachten','Ihn immer anfassen','Das Nest ausräumen'],0,'Die Eltern sind häufig noch in der Nähe. Ruhe hilft.'],
 ['❄️','Ein Tannenhäher sammelt Nüsse. Warum?',['Als Vorrat für den Winter','Zum Spielen mit Menschen','Um sie in Wasser zu legen'],0,'Der Tannenhäher legt Vorräte an. Manche Samen keimen später.'],
 ['🪟','Vögel fliegen gegen eine grosse Glasscheibe. Was hilft?',['Sichtbare Muster auf dem Glas','Noch mehr Spiegelglas','Nester vor dem Glas entfernen'],0,'Gut sichtbare Markierungen helfen Vögeln, Glas zu erkennen.'],
 ['🦠','Weniger Insekten leben auf einem Feld. Welche Folge ist möglich?',['Vögel finden weniger Nahrung','Alle Vögel werden grösser','Jeder Vogel baut zwei Nester'],0,'Wenn Insekten fehlen, fehlt vielen Vögeln wichtiges Futter.'],
 ['🏔️','Ein Kletterer entdeckt einen seltenen Vogel am Brutplatz.',['Abstand halten und nicht stören','Sofort nah herangehen','Mit lauter Musik anlocken'],0,'Störungen am Brutplatz können für seltene Arten gefährlich sein.'],
 ['🌳','Warum sind Hecken und Bäume zusammen gut?',['Sie bieten Nahrung, Nistplätze und Schutz','Sie halten Vögel vom Fliegen ab','Sie lassen alle Würmer verschwinden'],0,'Vögel nutzen verschiedene Teile des Lebensraums.'],
 ['🦗','Eine Rabenkrähe lebt mitten im Dorf. Was zeigt das?',['Sie kann sich gut anpassen','Sie braucht immer Schnee','Sie kann nicht fliegen'],0,'Rabenkrähen finden in vielen Lebensräumen Nahrung.']
 ];let part=0,index=0,correct=0,choice=-1,locked=false;const chapters=[EASY,HARD];function show(){const set=chapters[part];if(index>=set.length){if(part===0){part=1;index=0;$('step1').classList.remove('active');$('step2').classList.add('active');$('status').textContent='Teil 2 von 2';}else{return finish();}} const q=chapters[part][index];choice=-1;locked=false;$('heading').textContent=part===0?'Das hilft oder schadet':'Was würdest du tun?';$('picture').innerHTML=`<span class="nmg-big" aria-hidden="true">${q[0]}</span>`;$('question').textContent=q[1];$('options').innerHTML='';const order=q[2].map((x,i)=>({x,i})).sort(()=>Math.random()-.5);order.forEach(item=>{const b=document.createElement('button');b.className='nmg-option';b.type='button';b.textContent=item.x;b.addEventListener('click',()=>{if(locked)return;choice=item.i;[...$('options').children].forEach(x=>x.classList.remove('selected'));b.classList.add('selected');});$('options').append(b);});$('feedback').textContent='';$('feedback').className='nmg-fb';$('check').classList.remove('nmg-hidden');$('next').classList.add('nmg-hidden');$('bar').style.width=`${(part*10+index)/20*100}%`;}
function check(){if(choice<0||locked)return;const q=chapters[part][index];locked=true;const ok=choice===q[3];correct+=+ok;$('feedback').textContent=(ok?'✓ Richtig! ':'✕ Noch nicht ganz. ')+q[4];$('feedback').className='nmg-fb '+(ok?'good':'bad');[...$('options').children].forEach(btn=>{if(btn.textContent===q[2][q[3]])btn.classList.add('correct');if(btn.textContent===q[2][choice]&&!ok)btn.classList.add('wrong');});window.SafariTelemetry?.record({task:`Lebensraum Teil ${part+1}, Frage ${index+1}`,correct:ok,answer:q[2][choice],expected:q[2][q[3]],details:q[1]});$('check').classList.add('nmg-hidden');$('next').classList.remove('nmg-hidden');$('next').textContent=index===9&&part===1?'Auswertung':'Weiter';}
function finish(){$('game').classList.add('nmg-hidden');$('done').classList.remove('nmg-hidden');$('result').textContent=`${correct} von 20 Antworten richtig.`;window.SafariTelemetry?.record({task:'Lebensraum Abschluss',correct:correct===20,correctCount:correct,total:20,answer:`${correct}/20`,expected:'20/20'});}
$('check').addEventListener('click',check);$('next').addEventListener('click',()=>{index++;show();});show();})();
</script></body></html>
