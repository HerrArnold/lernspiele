name: Publish current LernSafari2 to lernspiele
# Keep the public Lernspiele/main aligned with Lernspiele2/main.
# Preserve only the destination-specific GitHub Actions workflow.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-lernsafari.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-lernsafari-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main website
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Checkout current Lernspiele2 main
        uses: actions/checkout@v4
        with:
          repository: HerrArnold/Lernspiele2
          ref: main
          path: _lernsafari_source

      - name: Copy complete current website including images and games
        run: |
          test -f _lernsafari_source/index.html
          test -f _lernsafari_source/original/assets/login-config.js
          test -d _lernsafari_source/spiele
          test -d _lernsafari_source/assets
          rsync -a --delete --exclude='.git/' --exclude='.github/' --exclude='_lernsafari_source/' _lernsafari_source/ ./
          rm -rf _lernsafari_source
          test -f index.html
          test -f cloudflare-integration.js
          test ! -e unterrichtsmodus-admin.js
          test ! -e unterrichtsmodus.js
          test ! -e unterrichtsmodus.css
          test -f original/assets/daily-november-2026.js
          test -f original/assets/pokemon-pocket-engine.js
          grep -q 'Jetzt abfragen: Wer ist wo?' admin-dashboard.js
          grep -q 'lernsafari-api.ergohd02.workers.dev' original/assets/login-config.js

      - name: Commit and publish synced main website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Sync Lernspiele2 main: remove classroom modes, manual activity, latest games"
            git push origin HEAD:main
          fi
