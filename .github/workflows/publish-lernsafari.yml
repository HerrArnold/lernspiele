name: Publish current LernSafari2 to lernspiele
# Refresh requested 2026-11-13: copy current Lernspiele2/main to lernspiele/main.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-lernsafari.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-lernsafari-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main website
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Checkout current Lernspiele2 main
        uses: actions/checkout@v4
        with:
          repository: HerrArnold/Lernspiele2
          ref: main
          path: _lernsafari_source

      - name: Copy complete current website including images and games
        run: |
          test -f _lernsafari_source/index.html
          test -f _lernsafari_source/original/assets/login-config.js
          test -d _lernsafari_source/spiele
          test -d _lernsafari_source/assets
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='_lernsafari_source/' _lernsafari_source/ ./
          rm -rf _lernsafari_source
          test -f index.html
          test -f cloudflare-integration.js
          test -f unterrichtsmodus-admin.js
          grep -q 'lernsafari-api.ergohd02.workers.dev' original/assets/login-config.js

      - name: Commit and publish synced main website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Sync current Lernspiele2 main to Lernspiele"
            git push origin HEAD:main
          fi
