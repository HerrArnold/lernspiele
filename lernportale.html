<!doctype html>
<html lang="de-CH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f5e8c3">
  <title>Lernportale – Klasse 3b</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#342e24;background:#f4ebcf}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:linear-gradient(170deg,#e0eef1,#f3e1b9);position:relative}
    body::before{content:"";position:fixed;inset:0;background:url("assets/hakuna_matata_banner.png") center / cover no-repeat;opacity:.21;pointer-events:none}
    .page{position:relative;max-width:1130px;margin:auto;padding:24px 25px 48px}
    header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:25px 33px;background:#fffaf0ed;border:1px solid #fff9;border-radius:26px;box-shadow:0 14px 34px #594b3322}
    h1{margin:0;color:#76512d;font-size:clamp(36px,4.5vw,56px);font-weight:900;letter-spacing:-1.5px}
    .back{display:flex;align-items:center;gap:8px;text-decoration:none;color:#507441;background:#f0f5e8;border:1px solid #d3e4cb;padding:12px 17px;border-radius:15px;font-weight:800;font-size:16px}
    .back:hover,.back:focus-visible{background:#e4efd8;outline:2px solid #5a874b;outline-offset:2px}
    .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;margin-top:23px}
    .portal{background:#fffef9;border:2px solid #f2ebdc;border-radius:23px;min-height:260px;padding:23px 14px 19px;box-shadow:0 8px 21px #37491c1b;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:17px;text-decoration:none;color:inherit;transition:transform .16s,box-shadow .16s}
    .portal:hover,.portal:focus-visible{transform:translateY(-4px);box-shadow:0 14px 26px #37491c35;outline:2px solid #8aab75;outline-offset:2px}
    .portal img{width:142px;height:142px;display:block;object-fit:contain;border-radius:18px;max-width:100%}
    .portal h2{margin:0;color:#3b4732;font-weight:850;font-size:clamp(21px,2.1vw,27px);text-align:center}
    @media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.portal{min-height:235px}.portal img{width:124px;height:124px}}
    @media(max-width:510px){.page{padding:13px 12px 28px}header{padding:18px 15px}.back{padding:9px 10px;font-size:13px}h1{font-size:33px}.grid{gap:11px}.portal{padding:14px 9px;min-height:182px;gap:10px}.portal img{width:105px;height:105px}.portal h2{font-size:17px}}
    @media(prefers-reduced-motion:reduce){.portal{transition:none}}
  </style>
</head>
<body>
  <main class="page">
    <header>
      <h1>Lernportale</h1>
      <a class="back" href="index.html" aria-label="Zurück zu den Lernspielen">← Lernspiele</a>
    </header>
    <section class="grid" aria-label="Lernportale auswählen">
      <a class="portal" href="https://anton.app/de/" target="_blank" rel="noopener noreferrer"><img src="assets/portale/anton.png" alt="ANTON Logo"><h2>Anton</h2></a>
      <a class="portal" href="https://antolin.westermann.de/" target="_blank" rel="noopener noreferrer"><img src="assets/portale/antolin.png" alt="Antolin Logo"><h2>Antolin</h2></a>
      <a class="portal" href="https://kahoot.it/" target="_blank" rel="noopener noreferrer"><img src="assets/portale/kahoot.png" alt="Kahoot Logo"><h2>Kahoot</h2></a>
      <a class="portal" href="https://www.klett.ch/login/start" target="_blank" rel="noopener noreferrer"><img src="assets/portale/klett.jpg" alt="Klett Logo"><h2>Klett</h2></a>
    </section>
  </main>
</body>
</html>
