<!doctype html><html lang="de-CH"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fbf9f3"><title>Stellentafel</title><style>
:root{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#283123;background:#fbf9f3;--green:#417547;--blue:#5289bb}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 4% 6%,#f5e5c3 0,transparent 36%),radial-gradient(circle at 96% 97%,#dcead5 0,transparent 40%),#fbf9f3}
button,input{font:inherit}button{cursor:pointer}.shell{max-width:1110px;margin:auto;padding:15px 22px 22px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:13px}.brand{display:flex;align-items:center;gap:12px}
.logo{width:49px;height:49px;display:grid;place-items:center;background:#e8f0e4;border-radius:13px;font-size:26px}
h1{font-size:clamp(24px,2.7vw,36px);margin:0;line-height:1.1;color:#3d653b}
.stats{display:flex;align-items:center;gap:11px;justify-content:flex-end;flex-wrap:wrap}.streak{background:white;border:1px solid #dce3d5;border-radius:12px;padding:10px 14px;font-size:15px;font-weight:750;white-space:nowrap}.hearts{font-size:29px;white-space:nowrap;color:#d13d4f;letter-spacing:2px}.heart-empty{color:#b7b9b9}
.plain{background:white;border:1px solid #d6dfd0;color:#475841;border-radius:11px;padding:9px 13px;font-size:14px;font-weight:700}
.board{background:#fffdfa;border:2px solid #e3dfd2;border-radius:24px;box-shadow:0 16px 40px #4b5e3818;padding:16px 25px 20px;min-height:490px}
.feedback{font-size:clamp(18px,2.3vw,25px);font-weight:850;min-height:35px;text-align:center;color:#465842;margin:0 auto 5px}.feedback.good{color:#27834f}.feedback.bad{color:#b84b3a}
.prompt{text-align:center;font-size:clamp(21px,2.6vw,30px);font-weight:800;color:#364c31;margin:8px auto 15px}
.target{display:inline-flex;background:#eff6e8;border:2px solid #bed1ad;border-radius:16px;padding:5px 25px;font-size:clamp(32px,4vw,47px);font-weight:900;color:#334d2b;min-width:112px;justify-content:center}
.center{text-align:center}.actions{display:flex;justify-content:center;gap:10px;margin-top:16px}.action{border:0;border-radius:14px;background:#51864e;color:white;font-size:21px;font-weight:850;padding:12px 32px;min-width:245px;min-height:51px;box-shadow:0 6px 13px #3c6b3c24}.action:hover{background:#416e3f}.action:disabled{opacity:.65;cursor:default}
.hide{display:none!important}.solution{max-width:820px;margin:auto}.compare{display:grid;grid-template-columns:1fr 1fr;gap:14px}.compare-card{border:2px solid #dfded7;border-radius:16px;background:#fff;padding:13px;min-height:130px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}.compare-card.right{border-color:#9dc79a;background:#f4fbf1}.compare-label{font-size:15px;color:#716b5b;font-weight:800}.compare-content{font-size:clamp(21px,3vw,30px);font-weight:850;max-width:100%;overflow-wrap:anywhere}.game-over{font-size:45px;font-weight:900;color:#a83e47;text-align:center;margin:0 0 10px}
.numinput{width:110px;max-width:100%;border:2px solid #b9cbb2;background:white;border-radius:13px;padding:12px 9px;font-size:29px;font-weight:800;text-align:center;color:#26372a;outline:none}.numinput:focus{border-color:#568f55;box-shadow:0 0 0 3px #558d5533}
.input-row{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap}.inputgroup{text-align:center}.inputgroup label{display:block;font-size:17px;font-weight:850;margin-bottom:7px;color:#405c3a}
.book-controls{display:flex;align-items:center;justify-content:center;gap:20px;margin-bottom:8px}.page-btn{background:#eef4e8;color:#33502e;border:2px solid #c8d8bc;border-radius:12px;padding:5px 17px;font-size:26px;font-weight:900;min-width:67px}.page-btn:disabled{opacity:.3}.page-label{font-size:21px;font-weight:850;min-width:180px;text-align:center}
.book{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;width:min(100%,800px);margin:auto}.cell{aspect-ratio:1.75/1;background:white;border:1px solid #d0d9c9;border-radius:6px;font-size:clamp(13px,1.35vw,20px);font-weight:750;color:#3b5140;display:grid;place-items:center;padding:0;cursor:pointer}.cell:hover{background:#e7f0df}.cell.selected{background:#e0f1d7;border:2px solid #3c8c46}.cell.blank{color:transparent}.cell.correct-cell{background:#bce4a5;border:2px solid #408a38;color:#214d28}.book .cell:focus-visible{outline:3px solid #426eb5;outline-offset:1px}
.tiny-instruction{text-align:center;font-size:16px;color:#686653;margin:0 auto 8px}.blocks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;max-width:850px;margin:16px auto 18px}.blockcol{background:#fcfcf8;border:2px solid #e5e9df;border-radius:16px;padding:12px 10px;text-align:center;min-height:147px}.block-title{font-size:17px;font-weight:850;color:#415a3c;margin-bottom:9px}.block-drawing{min-height:91px;display:flex;justify-content:center;align-items:center;gap:7px;flex-wrap:wrap;align-content:center}.hundred{height:34px;width:34px;border:3px solid #28382d;background:#fff}.ten{height:35px;width:7px;border-radius:3px;background:#28382d}.one{width:8px;height:8px;background:#28382d;border-radius:50%}
.blockcol .numinput{width:106px}.number-large{font-size:clamp(52px,7vw,86px);font-weight:900;color:#364d31;text-align:center;margin:13px 0 12px}
.place-table{border-collapse:separate;border-spacing:0;width:min(100%,480px);margin:8px auto 19px;border:2px solid #92b18d;border-radius:16px;overflow:hidden}.place-table th{background:#e6f0df;font-size:24px;padding:10px;border-right:2px solid #c7d7c4}.place-table td{text-align:center;border-top:2px solid #c7d7c4;border-right:2px solid #c7d7c4;height:91px}.place-table th:last-child,.place-table td:last-child{border-right:0}.place-table .numinput{width:90px;height:67px}.place-table .digit{font-size:52px;font-weight:850}
.decompose{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;margin:34px auto}.decompose .numinput{width:155px;font-size:34px}.plus{font-size:38px;font-weight:800;color:#677963}
.mini-book{display:grid;grid-template-columns:repeat(10,1fr);max-width:440px;gap:2px;margin:8px auto}.mini-book span{border:1px solid #dae1d4;text-align:center;font-size:12px;padding:2px}.mini-book .answer-cell{background:#b7e0ad;font-weight:900}.result-detail{text-align:center;font-size:17px;font-weight:750;color:#496348;margin-top:12px}
@media(max-height:820px) and (min-width:740px){.shell{padding-top:8px}.top{margin-bottom:8px}.board{padding:10px 22px 15px;min-height:0}.book{max-width:650px}.cell{aspect-ratio:1.5/1;font-size:16px}.prompt{margin:5px auto 10px}.blocks{margin:7px auto}.blockcol{min-height:126px}.block-drawing{min-height:68px}.number-large{margin:5px 0;font-size:65px}.decompose{margin:19px auto}.place-table{margin-bottom:10px}.feedback{min-height:28px}.action{min-height:46px}}
@media(max-width:730px){.shell{padding:11px}.top{flex-wrap:wrap}.stats{margin-left:auto}.board{padding:14px 9px;min-height:0}.book{gap:2px}.cell{aspect-ratio:1/1;font-size:clamp(10px,2.5vw,15px);border-radius:4px}.blocks{gap:5px}.blockcol{padding:8px 4px;min-height:126px}.block-title{font-size:13px}.block-drawing{min-height:83px;gap:4px}.hundred{width:25px;height:25px;border-width:2px}.ten{width:5px;height:27px}.one{width:6px;height:6px}.numinput{width:77px;font-size:24px}.decompose .numinput{width:91px}.plus{font-size:25px}.compare{gap:6px}.compare-card{padding:7px;min-height:95px}.streak{font-size:13px}.hearts{font-size:24px}.action{min-width:0;width:100%}}

/* Stellentafel mit Punkten: pro Stelle maximal neun Punkte, 5 pro Zeile. */
.dot-table{width:min(100%,600px);table-layout:fixed;margin:26px auto 28px}
.dot-table td{height:158px;padding:12px 7px;vertical-align:middle}
.dot-grid{display:grid;grid-template-columns:repeat(5,13px);grid-auto-rows:13px;gap:11px 10px;justify-content:center;align-content:center;min-height:38px}
.place-dot{display:block;width:13px;height:13px;border-radius:50%;background:#28382d}
.answer-number{display:flex;align-items:center;justify-content:center;gap:16px;margin:19px auto 25px}
.answer-number label{font-size:24px;font-weight:850;color:#405c3a}
.answer-number .numinput{width:155px}
@media(max-width:730px){.dot-table{margin:18px auto}.dot-table td{height:125px;padding:10px 3px}.dot-grid{grid-template-columns:repeat(5,9px);grid-auto-rows:9px;gap:10px 6px}.place-dot{width:9px;height:9px}.answer-number{gap:10px}.answer-number label{font-size:21px}}
@media(max-width:390px){.dot-grid{grid-template-columns:repeat(5,7px);grid-auto-rows:7px;gap:8px 5px}.place-dot{width:7px;height:7px}}
</style><link rel="stylesheet" href="../assets/game-theme.css">
<script defer src="../assets/analytics-config.js"></script>
<link rel="stylesheet" href="../assets/lernsteuerung.css?v=1"><script defer src="../assets/lernsteuerung.js?v=1"></script><script defer src="../assets/lernhelfer.js?v=1"></script><link rel="stylesheet" href="../assets/new-safari-skin.css"></head><body>
<div class="safari-exit-bar"><span>Lernsafari</span><a href="../index.html#aktuelle">✕ Spiel beenden</a></div><main class="shell"><header class="top"><div class="brand"><div class="logo" aria-hidden="true">🔢</div><h1>Stellentafel</h1></div><div class="stats"><div id="streak" class="streak">Richtig: 0</div><div id="hearts" class="hearts">♥ ♥ ♥</div><button class="plain" id="restartTop">Neu starten</button></div></header><section class="board"><div id="feedback" class="feedback" aria-live="polite"></div><div id="playArea"><div id="task"></div><div class="actions" id="actionRow"><button class="action" id="checkBtn">Überprüfen</button></div></div><div id="solutionArea" class="solution hide"><div class="game-over hide" id="gameOverTitle">Game Over!</div><div class="compare"><div class="compare-card"><div class="compare-label">Deine Antwort</div><div class="compare-content" id="yourAnswer"></div></div><div class="compare-card right"><div class="compare-label">Richtige Lösung</div><div class="compare-content" id="correctAnswer"></div></div></div><div id="answerCells"></div><div class="actions"><button class="action" id="nextBtn">Nächste Aufgabe</button></div></div></section></main><script>
function makeQuestion(){const n=uniqueNumber(999);return {n,parts:digits(n)}}
function dots(count){return `<div class="dot-grid" aria-label="${count} Punkte">${Array.from({length:count},()=>'<span class="place-dot"></span>').join('')}</div>`}
function table(parts){return `<table class="place-table dot-table"><thead><tr><th>H</th><th>Z</th><th>E</th></tr></thead><tbody><tr>${parts.map(d=>`<td>${dots(d)}</td>`).join('')}</tr></tbody></table>`}
function renderQuestion(q){return `${table(q.parts)}<div class="answer-number"><label for="number">Zahl:</label>${input('number','Zahl')}</div>`}
function checkAnswer(q){const x=$('number').value.trim();if(!/^\d{1,3}$/.test(x)){setFeedback('Schreibe die Zahl.');return;}result(Number(x)===q.n,x,String(q.n))}

const $=id=>document.getElementById(id);
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[rand(0,a.length-1)];
let hearts=3,streak=0,current=null,phase='play',answered=0,previous=-1,timer=null;
function val(n){return Number(n)}
function uniqueNumber(max=1000){let n=rand(1,max);if(n===previous)n=n===max?1:n+1;previous=n;return n}
function updateStats(){$('streak').textContent='Richtig: '+streak;$('hearts').innerHTML=Array.from({length:3},(_,i)=>`<span class="${i<hearts?'':'heart-empty'}">${i<hearts?'♥':'♡'}</span>`).join(' ')}
function setFeedback(s,kind=''){$('feedback').textContent=s;$('feedback').className='feedback '+kind}
function input(id,placeholder=''){return `<input class="numinput" id="${id}" type="text" inputmode="numeric" autocomplete="off" aria-label="${placeholder||id}" maxlength="4">`}
function drawBlocks(h,z,e){const n=(cls,count)=>Array.from({length:count},()=>`<span class="${cls}"></span>`).join('');return `<div class="blocks"><div class="blockcol"><div class="block-title">Hundertertafeln</div><div class="block-drawing">${n('hundred',h)}</div></div><div class="blockcol"><div class="block-title">Zehnerstangen</div><div class="block-drawing">${n('ten',z)}</div></div><div class="blockcol"><div class="block-title">Einerwürfel</div><div class="block-drawing">${n('one',e)}</div></div></div>`}
function digits(n){return [Math.floor(n/100),Math.floor(n%100/10),n%10]}
function nextQuestion(){clearTimeout(timer);phase='play';$('playArea').classList.remove('hide');$('solutionArea').classList.add('hide');$('gameOverTitle').classList.add('hide');$('answerCells').innerHTML='';setFeedback('');current=makeQuestion();$('task').innerHTML=renderQuestion(current);$('checkBtn').textContent='Überprüfen';$('checkBtn').disabled=false;if(typeof afterRender==='function')afterRender(current);const first=$('playArea').querySelector('input');if(first)first.focus({preventScroll:true});}
function result(ok,userAnswer,correctAnswer,extra=''){if(phase!=='play')return;window.SafariTelemetry?.record({task:'Aufgabe: '+(current?.n??'Stellenwerte'),correct:ok,answer:userAnswer,expected:correctAnswer});phase='result';answered++;if(ok){streak++;updateStats();setFeedback('Richtig! Hier kommt die nächste Aufgabe!','good');$('checkBtn').disabled=true;timer=setTimeout(nextQuestion,1350);return;}hearts=Math.max(0,hearts-1);if(hearts===0)streak=0;updateStats();setFeedback('Falsch – hier ist die richtige Lösung.','bad');$('playArea').classList.add('hide');$('solutionArea').classList.remove('hide');$('yourAnswer').innerHTML=userAnswer;$('correctAnswer').innerHTML=correctAnswer;$('answerCells').innerHTML=extra;if(hearts===0){$('gameOverTitle').classList.remove('hide');$('nextBtn').textContent='Neu starten'}else $('nextBtn').textContent='Nächste Aufgabe'}
function restart(){clearTimeout(timer);hearts=3;streak=0;answered=0;previous=-1;phase='play';if(typeof onRestart==='function')onRestart();updateStats();nextQuestion()}
$('checkBtn').addEventListener('click',()=>{if(phase==='play')checkAnswer(current)});
$('nextBtn').addEventListener('click',()=>hearts===0?restart():nextQuestion());$('restartTop').addEventListener('click',restart);
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&phase==='play'&&e.target.tagName==='INPUT')$('checkBtn').click()});
restart();
</script><script src="../assets/login-config.js"></script><script defer src="../assets/highscore.js"></script><link rel="stylesheet" href="../assets/highscore.css">
<script defer src="../assets/game-telemetry.js"></script>
<script src="../assets/new-safari-bridge.js"></script></body></html>
