<!doctype html><html lang="de-CH"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Malatelier · LernSafari Oase</title><link rel="stylesheet" href="../assets/oase-spiele.css"></head><body><main class="o-wrap"><header class="o-header"><small>🎨 OASE · KREATIVITÄT</small><h1>Mein Malatelier</h1><p>Male frei mit verschiedenen Farben, Stiften und Formen. Dein Kunstwerk kannst du als Bild speichern.</p></header><section class="o-panel"><div class="o-tools"><div class="o-palette" id="palette"></div><label>Stift <select id="brush"><option value="3">Dünn</option><option value="8" selected>Mittel</option><option value="18">Dick</option></select></label><label>Werkzeug <select id="tool"><option value="pen">Stift</option><option value="erase">Radiergummi</option></select></label></div><canvas id="canvas" class="o-canvas" width="960" height="600" aria-label="Zeichenfläche"></canvas><div class="o-tools"><button id="undo" class="o-button">↶ Rückgängig</button><button id="clear" class="o-button">Leeres Blatt</button><button id="save" class="o-button primary">Bild speichern</button></div><p class="o-note">Du kannst mit Maus, Touchpad oder Finger malen. Das Bild wird beim Speichern als PNG-Datei auf deinem Gerät abgelegt.</p></section></main><script>window.OASE_ART_MODE='frei'</script><script src="../assets/oase-kunst.js" defer></script></body></html>
