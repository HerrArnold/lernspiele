<!doctype html><html lang="de-CH"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Körperteile benennen · LernSafari</title>
<link rel="stylesheet" href="../assets/game-theme.css"><script defer src="../assets/analytics-config.js"></script>
<style>:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#fbf8ef;color:#2e4936}*{box-sizing:border-box}body{margin:0;padding:18px}main{max-width:1100px;margin:auto}h1{font-size:clamp(25px,4vw,36px);margin:5px 0;color:#315b44}.intro{color:#6a5943}
.panel{border:2px solid #d4dfc7;border-radius:20px;padding:16px;background:white}.status{display:flex;flex-wrap:wrap;align-items:center;gap:16px;margin:0 0 15px;font-weight:700}.track{flex:1;min-width:100px;background:#e8eadf;height:12px;border-radius:20px;overflow:hidden}.bar{height:100%;background:#51835a;transition:width .2s}
.game-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(160px,.75fr);gap:17px}.pics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.card{display:grid;place-items:center;min-height:135px;padding:8px;border:3px solid #d8e1d4;border-radius:15px;background:#fffdf8;color:#284836;cursor:pointer;position:relative}
.card img{height:113px;width:100%;object-fit:contain}.card.active,.name.active{border-color:#305b44;box-shadow:0 0 0 3px #d1ebc6}.card.solved,.name.solved{border-color:#70aa72;background:#e2f1df;opacity:.75;cursor:default}
.card.solved::after{content:'✓';position:absolute;right:8px;top:7px;background:#3f8154;color:#fff;padding:3px 8px;border-radius:40px}
.names{display:grid;gap:8px;align-content:start}.name{padding:13px;border:2px solid #c6d7bf;border-radius:11px;background:#eff4e9;text-align:center;color:#31563e;font-weight:850;font-size:19px;cursor:pointer}
.message{min-height:27px;margin:12px 0;font-size:16px;font-weight:750}.wrong{color:#b24a39}.good{color:#247343}button:disabled{cursor:default}.actions{display:flex;gap:10px;flex-wrap:wrap}
.next{background:#315f47;color:white;font:inherit;font-weight:800;border:0;border-radius:12px;padding:12px 20px;cursor:pointer}.next:disabled{opacity:.45}.finish{background:#e6f3df;border:1px solid #b6d3aa;border-radius:15px;padding:16px;margin-top:10px}[hidden]{display:none!important}
@media(max-width:730px){.game-grid{grid-template-columns:1fr}.pics{grid-template-columns:repeat(3,minmax(0,1fr))}.names{grid-template-columns:repeat(2,minmax(0,1fr))}.card{min-height:100px}.card img{height:90px}.name{font-size:16px}body{padding:8px}}
</style></head><body><main><h1>Körperteile benennen</h1>
<p class="intro">Wähle zuerst ein Bild und dann das passende englische Wort. Findest du alle Paare?</p>
<section class="panel"><div class="status"><span id="round"></span><div class="track"><div class="bar" id="bar"></div></div><span id="points">0 richtig</span></div>
<div class="game-grid"><div class="pics" id="pics"></div><div class="names" id="names"></div></div>
<div class="message" id="message" aria-live="polite">Wähle ein Bild.</div><div class="actions"><button id="next" class="next" hidden>Nächste Runde →</button><button id="again" class="next" hidden>Nochmals spielen</button></div>
<div class="finish" id="finish" hidden></div></section></main>
<script>
(()=>{
const CARDS=[
['ear','ear'],['fingers','fingers'],['toes','toes'],['leg','leg'],['arm','arm'],
['head','head'],['hair','hair'],['nose','nose'],['mouth','mouth'],['eye','eye'],
['eyes','eyes'],['foot','foot'],['hand','hand'],['chest','chest'],['shoulder','shoulder'],
['elbow','elbow'],['neck','neck'],['knee','knee'],['teeth','teeth']];
const $=id=>document.getElementById(id);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let cards=[],start=0,selected=null,done=new Set(),wrong=new Set(),correct=0,firstTry=0;
function record(item){try{window.SafariTelemetry?.record(item)}catch(_){}}
function begin(){cards=shuffle(CARDS.map(([id,title])=>({id,title})));start=0;correct=0;firstTry=0;$('finish').hidden=true;$('again').hidden=true;round()}
function round(){selected=null;done=new Set();wrong=new Set();$('next').hidden=true;$('pics').innerHTML='';$('names').innerHTML='';
const list=cards.slice(start,start+5);$('round').textContent='Runde '+(Math.floor(start/5)+1)+' / '+Math.ceil(cards.length/5);
$('points').textContent=correct+' / '+cards.length+' Paare';$('bar').style.width=(correct/cards.length*100)+'%';$('message').textContent='Wähle ein Bild.';
for(const item of shuffle(list.slice())){const b=document.createElement('button');b.type='button';b.className='card';b.dataset.id=item.id;b.setAttribute('aria-label','Bild auswählen');const img=document.createElement('img');
img.src='body-images/'+item.id+'.png';img.alt='Körperteil als Bild';img.loading='lazy';
img.onerror=()=>{b.setAttribute('aria-label','Bild fehlt: '+item.title);$('message').textContent='Ein Bild konnte nicht geladen werden. Bitte die Bilddateien prüfen.'};
b.appendChild(img);b.onclick=()=>chooseImage(item.id);$('pics').appendChild(b)}
for(const item of shuffle(list.slice())){const b=document.createElement('button');b.type='button';b.className='name';b.dataset.id=item.id;b.textContent=item.title;b.onclick=()=>chooseWord(item.id);$('names').appendChild(b)}
}
function chooseImage(id){if(done.has(id))return;selected=id;document.querySelectorAll('.card').forEach(b=>b.classList.toggle('active',b.dataset.id===id));$('message').textContent='Wähle jetzt das passende englische Wort.'}
function chooseWord(id){if(done.has(id))return;if(!selected){$('message').textContent='Wähle zuerst ein Bild.';return}
const pic=selected;selected=null;document.querySelectorAll('.card').forEach(b=>b.classList.remove('active'));
if(pic!==id){wrong.add(pic);$('message').className='message wrong';$('message').textContent='Noch nicht richtig. Versuche es mit einem anderen Wort.';return}
done.add(id);correct++;if(!wrong.has(id))firstTry++;$('message').className='message good';$('message').textContent='✓ Richtig: '+id+'!';
document.querySelectorAll('.card,.name').forEach(b=>{if(b.dataset.id===id){b.classList.add('solved');b.disabled=true}});
$('points').textContent=correct+' / '+cards.length+' Paare';$('bar').style.width=(correct/cards.length*100)+'%';
record({task:'Körperteil '+id,correct:!wrong.has(id),correctCount:wrong.has(id)?0:1,total:1,answer:id,expected:id,details:wrong.has(id)?'Nach einem Fehler richtig zugeordnet':'Beim ersten Versuch richtig'});
if(done.size===Math.min(5,cards.length-start)){
start+=done.size;
if(start<cards.length){$('next').hidden=false;$('message').textContent='Super! Alle Paare dieser Runde gefunden.'}
else{ $('finish').hidden=false;$('finish').innerHTML='<strong>Geschafft! Du hast alle '+cards.length+' Körperteile zugeordnet.</strong><p>Spiele nochmals, um die Wörter zu festigen.</p>';$('again').hidden=false;
const earned=firstTry;record({task:'Körperteile benennen Abschluss',correct:earned===cards.length,correctCount:earned,total:cards.length,answer:earned+'/'+cards.length,expected:cards.length+'/'+cards.length});}
}
}
$('next').onclick=round;$('again').onclick=begin;begin();
})();
</script><script src="../assets/new-safari-bridge.js"></script></body></html>
